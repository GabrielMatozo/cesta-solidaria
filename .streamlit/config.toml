[theme]
primaryColor = "#2E7D32"
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#212121"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200
maxMessageSize = 200

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501

[runner]
magicEnabled = true
postScriptGC = true

[client]
toolbarMode = "minimal"
showErrorDetails = false
# Sidebar nativa oculta (app renderiza a propria); acesso direto por URL segue protegido por require_login.
showSidebarNavigation = false

[logger]
level = "info"
messageFormat = "%(asctime)s %(levelname)s: %(message)s"


[global]
disableWatchdogWarning = true
showWarningOnDirectExecution = false
