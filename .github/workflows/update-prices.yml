name: Atualizar preços Tenda

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/scraper_tenda.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TENDA_BEARER_TOKEN: ${{ secrets.TENDA_BEARER_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: custo-cesta-${{ github.run_id }}
          path: custo_cesta.txt
          retention-days: 365
        if: always() && hashFiles('custo_cesta.txt') != 

  alerta:
    needs: scrape
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Falha na atualização de preços - Cesta Solidária';
            const busca = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            });
            if (busca.data.total_count > 0) {
              console.log('Issue aberta já existe para esta falha; não duplicando.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `O workflow de atualização de preços da Cesta Solidária falhou no run ${context.runId}. Verifique os logs e atualize manualmente se necessário.`,
            })
