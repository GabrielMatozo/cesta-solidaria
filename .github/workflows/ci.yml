name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - name: pytest
        env:
          SUPABASE_URL: https://teste.supabase.co
          SUPABASE_ANON_KEY: chave-anon-teste
          SUPABASE_SERVICE_ROLE_KEY: chave-service-teste
        run: pytest -q
